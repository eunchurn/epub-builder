title: 운수 좋은 날
author: 현진건
description: 〈운수 좋은 날〉은 현진건이 1924년 6월 《개벽》에 발표한 사실주의 단편 소설이다. 조선 민중들의 비참한 삶을 있는 그대로 묘사했다. 대한민국의 중학교 2학년 교과서 4에 수록되어 있으며, 뮤지컬로 만들어지기도 했다. 일본의 민족학교 수업에서도 이 소설을 가르친다
books:
- resources/body/example/main.md

cssFile: resources/css/styles.css
fonts:
- resources/fonts/KOPUSGoB.ttf
- resources/fonts/KOPUSGoL.ttf
- resources/fonts/KOPUSMjB.ttf
- resources/fonts/KOPUSMjL.ttf
- resources/fonts/NanumMyeongjo.ttf
cover: resources/images/개벽창간호.jpg
output: public/운수좋은날.epub

hideToC: true
